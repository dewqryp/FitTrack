spring.application.name=FitTrackBackend
spring.datasource.url=jdbc:postgresql://127.0.0.1:15432/fittrack
spring.datasource.username=fittrack
spring.datasource.password=fittrack
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1